<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Content Engine</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1a1d23; --muted: #5d6573; --faint: #8b93a1; --line: #e5e8ee; --soft: #f0f2f6;
  --accent: #2f5bea; --accent-soft: #e8eeff;
  --ok: #17703c; --ok-bg: #e6f5ec; --warn: #8a5a0b; --warn-bg: #fdf1dc; --bad: #b02a2a; --bad-bg: #fcebeb; --run: #2446c4; --run-bg: #e8eeff;
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  --shadow: 0 1px 2px rgba(20, 27, 40, .04), 0 2px 8px rgba(20, 27, 40, .04);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* header */
header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 14px; padding: 10px 20px; max-width: 1400px; margin: 0 auto; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
nav { display: flex; gap: 2px; }
nav a { padding: 6px 12px; border-radius: var(--r-sm); color: var(--muted); font-weight: 550; white-space: nowrap; }
nav a:hover { background: var(--soft); text-decoration: none; }
nav a.on { background: var(--accent-soft); color: var(--accent); }
.spacer { flex: 1; }
.bell { position: relative; display: inline-flex; align-items: center; gap: 6px; }
.badge { min-width: 20px; padding: 0 6px; height: 20px; border-radius: 99px; background: var(--soft); color: var(--muted); font-size: 12px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; }
.badge.hot { background: var(--bad); color: #fff; }

/* controls */
button { font: inherit; font-weight: 550; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: var(--r-sm); cursor: pointer; transition: background .12s, border-color .12s; }
button:hover:not(:disabled) { background: var(--soft); border-color: #d3d8e0; }
button:disabled { opacity: .55; cursor: progress; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { background: #2449c4; border-color: #2449c4; }
button.takeover { background: var(--ink); border-color: var(--ink); color: #fff; }
button.takeover:hover:not(:disabled) { background: #343a46; border-color: #343a46; }
button.small { padding: 3px 10px; font-size: 12px; border-radius: var(--r-xs); }
button.ghost { border-color: transparent; background: none; color: var(--muted); }
select.big { font-size: 18px; font-weight: 650; padding: 4px 8px; max-width: 220px; }
select { font: inherit; padding: 5px 8px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-width: 160px; }

/* layout */
main { max-width: 1400px; margin: 0 auto; padding: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); }
.pad { padding: 16px; }
h2 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
h3 { font-size: 12px; margin: 0 0 10px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.summary { color: var(--muted); }
.notice { background: var(--bad-bg); color: var(--bad); padding: 8px 20px; text-align: center; font-weight: 550; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 650; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.idle { background: var(--ok-bg); color: var(--ok); } .pill.running { background: var(--run-bg); color: var(--run); }
.pill.running::before { animation: pulse 1.4s ease-in-out infinite; }
.pill.offline { background: var(--soft); color: var(--muted); } .pill.error { background: var(--bad-bg); color: var(--bad); }
.pill.manual { background: var(--warn-bg); color: var(--warn); }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.running::before { animation: none; } }

/* phone cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.pcard { display: flex; flex-direction: column; gap: 12px; padding: 16px; color: inherit; border-radius: var(--r-md); }
.pcard:hover { text-decoration: none; border-color: #c9d1e4; box-shadow: 0 2px 4px rgba(20,27,40,.05), 0 6px 18px rgba(20,27,40,.07); }
.pcard .top { display: flex; align-items: center; gap: 10px; }
.pcard .name { font-size: 16px; font-weight: 650; flex: 1; }
.acct { display: flex; flex-direction: column; gap: 6px; }
.acct + .acct { padding-top: 10px; border-top: 1px dashed var(--line); }
.acct .who { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.app { font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: var(--r-xs); background: var(--soft); color: var(--muted); }
.qs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pcard .qs { grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.q .ql { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.q .ql b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.meter.full i { background: #2a9d5c; }
.pcard .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
.pcard .next { flex: 1 1 100%; min-width: 0; color: var(--muted); }
.pcard .next b { color: var(--ink); font-weight: 600; }
.tag { font-size: 11px; font-weight: 650; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.tag.bad { background: var(--bad-bg); color: var(--bad); } .tag.warn { background: var(--warn-bg); color: var(--warn); }
.more { color: var(--faint); font-size: 12px; }

/* detail */
.detail { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
.stage { position: sticky; top: 70px; padding: 14px; }
.screen { position: relative; background: #0f1115; border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 720/1612; width: 100%; max-width: 312px; margin: 0 auto; touch-action: none; }
.screen canvas, .screen img { width: 100%; height: 100%; display: block; object-fit: contain; }
.screen .veil { position: absolute; inset: auto 0 0 0; padding: 8px; text-align: center; font-size: 12px; color: #fff; background: rgba(15,17,21,.62); }
.screen .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #aab; font-size: 13px; padding: 20px; text-align: center; }
.toolbar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; }
.toolbar button { padding: 7px 0; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.2; }
.toolbar button span { font-size: 15px; }
.typer { display: flex; gap: 6px; margin-top: 8px; }
.typer input { flex: 1; min-width: 0; font: inherit; padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.quota-row { display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: center; }
.quota-row + .quota-row { margin-top: 12px; }
.tail { font: 12px/1.4 ui-monospace, Menlo, monospace; background: var(--bg); border-radius: var(--r-sm); padding: 10px; max-height: 180px; overflow: auto; white-space: pre-wrap; margin-top: 8px; }

/* job sections */
details.sec { border-radius: var(--r-md); }
details.sec > summary { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; font-weight: 650; list-style: none; border-radius: var(--r-md); }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--faint); border-bottom: 2px solid var(--faint); transform: rotate(-45deg); transition: transform .12s; margin: 0 4px 0 2px; }
details.sec[open] > summary::before { transform: rotate(45deg); }
details.sec > summary .sub { color: var(--faint); font-weight: 450; font-size: 12px; margin-left: auto; }
.sec .body { padding: 0 16px 12px; }
.sec.attn { border-color: #f1c9c9; } .sec.attn > summary { color: var(--bad); }
.grp { font-size: 12px; font-weight: 650; color: var(--muted); margin: 10px 0 2px; display: flex; gap: 6px; align-items: center; }
.job { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
.grp + .job { border-top: 0; }
.when b { display: block; white-space: nowrap; font-weight: 650; font-variant-numeric: tabular-nums; }
.when span { font-size: 12px; color: var(--faint); }
.when .late { color: var(--bad); font-weight: 650; }
.what .t { font-weight: 600; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.what .t em { font-style: normal; color: var(--muted); font-weight: 450; }
.what .d { color: var(--muted); }
.what .e { color: var(--bad); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; align-items: baseline; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.state { font-size: 11px; font-weight: 650; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.state.done { background: var(--ok-bg); color: var(--ok); } .state.skipped { background: var(--warn-bg); color: var(--warn); }
.empty { color: var(--muted); padding: 14px 0; }

/* alerts panel */
#alertPanel { max-width: 1400px; margin: 0 auto; padding: 14px 20px 0; }
#alertPanel .card { padding: 6px 16px 12px; }
.al { display: grid; grid-template-columns: 70px 74px minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: baseline; }
.al:first-of-type { border-top: 0; }
.al.unseen .x { font-weight: 600; }

/* tables (stats, research) */
.scroll-x { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 650; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.cap { max-width: 340px; }
.st { font-size: 12px; font-weight: 650; padding: 2px 8px; border-radius: 99px; background: var(--soft); }
.st.unverified { color: var(--bad); background: var(--bad-bg); }

dialog { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); color: var(--ink); width: min(900px, 94vw); padding: 0; box-shadow: 0 20px 60px rgba(20,27,40,.2); }
dialog::backdrop { background: rgba(20,27,40,.35); }
dialog pre { margin: 0; padding: 16px; max-height: 70vh; overflow: auto; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
dialog .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }

@media (max-width: 900px) {
  .detail { grid-template-columns: 1fr; }
  .stage { position: static; }
  .quota-row { grid-template-columns: 1fr; gap: 6px; }
}
@media (max-width: 600px) {
  .bar-in { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
  header h1 { font-size: 15px; }
  nav { order: 3; width: 100%; overflow-x: auto; }
  main { padding: 14px 12px; }
  #alertPanel { padding: 12px 12px 0; }
  .grid { grid-template-columns: 1fr; }
  .qs { grid-template-columns: 1fr 1fr; }
  .job { grid-template-columns: 96px minmax(0, 1fr); }
  .job .acts { grid-column: 2; justify-content: flex-start; }
  .al { grid-template-columns: 62px minmax(0, 1fr); } .al .kind, .al .mail { display: none; }
  h2 { font-size: 18px; }
  .screen { max-width: 220px; }
  .what .e { flex-direction: column; gap: 2px; } .what .e .trunc { white-space: normal; }
}

/* insights (post stats, research) */
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: -4px 0 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: none; padding: 5px 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.fl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
.sect { margin-top: 26px; }
.sect > h3 { display: flex; align-items: baseline; gap: 8px; }
.sect > h3 .hint { font-weight: 450; text-transform: none; letter-spacing: 0; color: var(--faint); font-size: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.acard { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.acard .head { display: flex; align-items: center; gap: 8px; font-weight: 650; min-width: 0; }
.acard .head .trunc { flex: 1; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 12px; }
.tile .tl { font-size: 11px; color: var(--muted); font-weight: 600; }
.tile .tv { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .tv.dim { color: var(--faint); font-weight: 600; }
.dl { display: inline-block; font-size: 11px; font-weight: 650; padding: 0 6px; border-radius: 99px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dl.up { background: var(--ok-bg); color: var(--ok); } .dl.down { background: var(--bad-bg); color: var(--bad); }
.dl.flat, .dl.na { background: var(--soft); color: var(--faint); }
.note { font-size: 12px; color: var(--muted); background: var(--soft); border-radius: var(--r-sm); padding: 6px 10px; }
.note.warn { background: var(--warn-bg); color: var(--warn); } .note.bad { background: var(--bad-bg); color: var(--bad); }
.plist { padding: 4px 16px; }
.prow { display: grid; grid-template-columns: 22px 38px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .rk { color: var(--faint); font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.th { position: relative; display: block; width: 38px; height: 64px; border-radius: var(--r-xs); background: linear-gradient(160deg, #dfe6f7, #c3cde6); overflow: hidden; flex: none; }
.th::after { content: ""; position: absolute; left: 50%; top: 50%; margin: -6px 0 0 -4px; border-left: 11px solid rgba(255,255,255,.85); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.pmain { min-width: 0; }
.pmain .pc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 550; }
.pmain .pm { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 2px; font-size: 12px; color: var(--muted); }
.pnum { text-align: right; font-variant-numeric: tabular-nums; min-width: 64px; }
.pnum b { display: block; font-size: 16px; letter-spacing: -.01em; }
.pnum span { font-size: 12px; color: var(--muted); }
.spark { display: block; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--accent); }
.spark .base { stroke: var(--line); stroke-width: 1; }
.sp-wrap { text-align: center; color: var(--faint); font-size: 10px; }
.chip { font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.scard { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.scard .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.scard .head b { font-size: 16px; }
.parts { display: flex; align-items: flex-end; gap: 6px; height: 54px; }
.parts .pt { flex: 1; min-width: 14px; max-width: 40px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 10px; color: var(--faint); }
.parts .pt i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
.parts .pt i.na { background: var(--line); }
.ab { display: grid; gap: 6px; }
.abrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; }
.abrow .bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.abrow .bar i { display: block; height: 100%; background: #8ea4ee; border-radius: 99px; }
.abrow.win .bar i { background: var(--accent); }
.abrow b { font-variant-numeric: tabular-nums; }
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.pair { padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.pair .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
.pair .vs div { font-variant-numeric: tabular-nums; } .pair .vs .r { text-align: right; }
.pair .vs .w { font-weight: 700; color: var(--accent); }
.kpis { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 4px; }
.kpis .tile .tv { font-size: 22px; }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.idea { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.idea .hk { font-size: 16px; font-weight: 650; line-height: 1.3; letter-spacing: -.01em; }
.idea .hk::before { content: "\201C"; color: var(--faint); } .idea .hk::after { content: "\201D"; color: var(--faint); }
.idea .ev { font-size: 12px; color: var(--muted); }
.idea .ag { font-size: 13px; }
.idea .rowx { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fmts { padding: 8px 16px; }
.frow { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.frow:first-child { border-top: 0; }
.frow .fn { font-weight: 600; } .frow .fn small { display: block; color: var(--faint); font-weight: 450; font-size: 11px; }
.frow .bar { height: 12px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.frow .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.frow .bar i.low { background: #b9c3dc; }
.frow .ex { grid-column: 2 / -1; font-size: 12px; color: var(--muted); margin-top: -4px; }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.theme { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.theme .tn { font-weight: 650; overflow-wrap: anywhere; }
.theme .tm { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.kwlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.kw { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.kw .kt { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.kw .kt b { font-size: 15px; }
.kw ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.kw li { font-size: 13px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.kw li span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.kw li em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.kw .lbl { font-size: 11px; color: var(--faint); font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }
.acct.listed { gap: 4px; }
.acct.listed .why { font-size: 12px; color: var(--muted); }
.pill.unk { background: var(--soft); color: var(--muted); }
@media (max-width: 600px) {
  .cards, .ideas, .kwlist { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
  .tile .tv { font-size: 17px; }
  .prow { grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; }
  .prow .rk { display: none; } .prow .sp-wrap { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; text-align: left; }
  .plist { padding: 2px 12px; }
  .frow { grid-template-columns: minmax(0, 1fr) auto; } .frow .bar { grid-column: 1 / -1; order: 3; } .frow .ex { grid-column: 1 / -1; }
  .filters { gap: 8px; }
  .pairs, .themes { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 380px) { .themes, .pairs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="bar-in">
    <h1>Content Engine</h1>
    <nav id="nav">
      <a href="#/" data-nav="phones">Phones</a>
      <a href="#/stats" data-nav="stats">Post stats</a>
      <a href="#/research" data-nav="research">Research</a>
    </nav>
    <span class="spacer"></span>
    <button id="bellBtn" class="bell" aria-expanded="false" aria-controls="alertPanel">Alerts <span class="badge" id="alertBadge">0</span></button>
  </div>
  <div class="notice" id="conn" hidden>Engine not reachable. Retrying…</div>
</header>
<div id="alertPanel" hidden></div>

<main>
  <section id="view-phones">
    <div class="page-head"><h2>Phones</h2><span class="summary" id="summary"></span></div>
    <div class="grid" id="grid"><div class="empty">Loading…</div></div>
  </section>

  <section id="view-phone" hidden>
    <div class="page-head">
      <a href="#/" id="backLink">‹ All phones</a>
      <h2 id="pName"></h2>
      <select id="pSwitch" class="big" aria-label="Switch phone" hidden></select>
      <span id="pStatus" class="pill"></span>
      <span class="spacer"></span>
      <button id="takeBtn" class="takeover">Take over</button>
    </div>
    <div class="detail">
      <aside class="card stage">
        <div class="screen" id="screen">
          <canvas id="cv" width="720" height="1612"></canvas>
          <div class="msg" id="screenMsg">connecting to the phone…</div>
          <div class="veil" id="veil">View only. Take over to control the phone.</div>
        </div>
        <div class="toolbar">
          <button data-key="back"><span>◀</span>Back</button>
          <button data-key="home"><span>●</span>Home</button>
          <button data-key="recents"><span>■</span>Apps</button>
          <button data-key="wake"><span>☀</span>Wake</button>
          <button data-key="power"><span>⏻</span>Power</button>
        </div>
        <form class="typer" id="typer">
          <input id="typeIn" placeholder="Type text on the phone" autocomplete="off">
          <button>Send</button>
        </form>
      </aside>
      <div class="stack">
        <div class="card pad" id="quotaCard"></div>
        <div class="card pad" id="runningCard" hidden></div>
        <div id="jobsBox" class="stack"></div>
      </div>
    </div>
  </section>

  <section id="view-stats" hidden>
    <div class="page-head"><h2>Post stats</h2><span class="summary" id="statsSummary"></span></div>
    <div class="filters" id="statsFilters"></div>
    <div id="statsBody"><div class="empty">Loading…</div></div>
  </section>
  <section id="view-research" hidden>
    <div class="page-head"><h2>Research</h2><span class="summary" id="researchSummary"></span></div>
    <div class="filters" id="researchFilters"></div>
    <div id="researchBody"><div class="empty">Loading…</div></div>
  </section>
</main>

<dialog id="logDlg"><div class="bar"><b id="logTitle">Log</b><button onclick="logDlg.close()">Close</button></div><pre id="logText"></pre></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const post = (u, b) => fetch(u, {method: "POST", headers: {"Content-Type": "application/json"}, body: b ? JSON.stringify(b) : null}).then(r => r.json());
const n = v => v == null ? "–" : Number(v).toLocaleString();

// ---------------------------------------------------------------- time (always the viewer's own timezone)
const hm = t => t ? new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "";
const dayhm = t => t ? new Date(t * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "";
const sameDay = (a, b) => new Date(a * 1000).toDateString() === new Date(b * 1000).toDateString();
function when(t, now) {  // "14:30" (+ weekday when not today)
  if (!t) return "";
  return sameDay(t, now) ? hm(t) : new Date(t * 1000).toLocaleDateString([], {weekday: "short"}) + " " + hm(t);
}
function rel(t, now) {   // "in 2 h", "5 min ago"
  if (!t) return "";
  const d = t - now, a = Math.abs(d);
  if (a < 60) return "now";
  const u = a < 3600 ? Math.round(a / 60) + " min" : a < 86400 ? (Math.round(a / 360) / 10).toString().replace(/\.0$/, "") + " h" : Math.round(a / 86400) + " d";
  return d > 0 ? "in " + u : u + " ago";
}

// ---------------------------------------------------------------- data adapter
// Backend today serves ONE phone at the top level of /api/state. Backend tomorrow may serve
// {now, phones: [{id, name, ...the same per-phone fields}]}. Everything below only sees phones[].
const PHONE_FIELDS = ["status", "phone_ok", "paused", "pausing", "running", "tail", "jobs", "alerts", "accounts", "mirror_error"];
function normalize(raw) {
  const list = Array.isArray(raw.phones) ? raw.phones : [{id: "main", name: raw.name || "noswipe", ...Object.fromEntries(PHONE_FIELDS.map(k => [k, raw[k]]))}];
  const phones = list.map((p, i) => {
    const q = {id: String(p.id ?? "phone-" + (i + 1)), name: p.name || p.id || "Phone " + (i + 1), ...p};
    q.jobs = q.jobs || []; q.alerts = q.alerts || []; q.accounts = q.accounts || []; q.tail = q.tail || [];
    q.status = q.status || (q.phone_ok === false ? "offline" : q.paused ? "manual" : q.running ? "running" : q.mirror_error ? "error" : "idle");
    return q;
  });
  return {now: raw.now || Date.now() / 1000, phones};
}

// ---------------------------------------------------------------- state
let S = null, CUR = null;
const BUSY = new Set();                       // "id:action" buttons currently in flight
const OPEN = {};                              // details sections the viewer opened/closed
const KIND = {post: "Post", stats: "Stats", research: "Research", delete: "Delete", preflight: "Preflight"};
const STATUS = {idle: "Idle", running: "Running", offline: "Offline", error: "Screen error", manual: "Taken over"};
const appName = a => ({tiktok: "TikTok", instagram: "Instagram", x: "X", reddit: "Reddit"})[a] || a;
const appTag = a => `<span class="app">${({tiktok: "TT", instagram: "IG", x: "X", reddit: "RD"})[a] || esc(a)}</span>`;
const listed = a => a.automated === false;   // X / Reddit: on the phone, logged in by the owner, nothing runs for them
const listedRow = a => `<div class="acct listed"><div class="who">${appTag(a.app)}<span class="trunc">${a.app === "reddit" ? "u/" : "@"}${esc(a.account)}</span>` +
  `<span class="pill unk" title="${esc(a.note || "")}">Login: unknown</span></div><div class="why">Owner logs in with Take over. Not automated: no posting, no checks.</div></div>`;
const paused = () => !!(CUR && CUR.paused);
const phoneQ = () => CUR && CUR.id !== "main" ? "?phone=" + encodeURIComponent(CUR.id) : "";
const withPhone = o => CUR && CUR.id !== "main" ? {...o, phone: CUR.id} : o;
const phoneStatus = p => p.status === "running" && p.running ? `Running · ${KIND[p.running.kind] || p.running.kind}` : STATUS[p.status] || p.status;
const needsAttention = p => p.jobs.filter(j => ["failed", "unverified"].includes(j.status));
const waiting = p => p.jobs.filter(j => j.status === "waiting").sort((a, b) => a.run_at - b.run_at);
const unseenAlerts = p => p.alerts.filter(a => !a.seen).length;

function jobText(j) {
  const a = j.args || {}, cap = a.caption || "";
  if (j.kind === "post") return {t: "Post", d: `${j.label ? j.label + " · " : ""}${cap}`, x: a.visibility || a.audience || ""};
  if (j.kind === "stats") return {t: `Stats ${j.label || ""}`.trim(), d: cap, x: ""};
  if (j.kind === "research") return {t: "Research", d: `“${a.keyword}” · ${a.minutes} min`, x: ""};
  if (j.kind === "delete") return {t: "Delete", d: cap, x: ""};
  if (j.kind === "preflight") return {t: "Morning checks", d: "phone, accounts, disks, render server, today's plan", x: ""};
  return {t: KIND[j.kind] || j.kind, d: "", x: ""};
}

function meter(label, used, lim, unit = "") {
  const u = Math.round(used || 0), pct = lim ? Math.min(100, u / lim * 100) : 0;
  return `<div class="q" title="${label}: ${u} of ${lim ?? "no limit"}${unit}"><div class="ql"><span>${label}</span><b>${u}/${lim ?? "–"}${unit}</b></div>` +
    `<div class="meter${lim && u >= lim ? " full" : ""}"><i style="width:${pct}%"></i></div></div>`;
}
const quotas = a => `<div class="qs">${meter("Posts", a.used.posts, a.limits.posts_per_day)}${meter("Likes", a.used.likes, a.limits.likes_per_day)}` +
  `${meter("Comments", a.used.comments, a.limits.comments_per_day)}${meter("Research", a.used.research_minutes, a.limits.research_minutes_per_day, "m")}</div>`;

// ---------------------------------------------------------------- overview
function phoneCard(p, now) {
  const auto = p.accounts.filter(a => !listed(a)), extra = p.accounts.filter(listed);
  const accts = auto.slice(0, 2).map(a => `<div class="acct"><div class="who">${appTag(a.app)}<span class="trunc">@${esc(a.account)}</span></div>${quotas(a)}</div>`).join("") +
    (auto.length > 2 ? `<div class="more">+${auto.length - 2} more account${auto.length > 3 ? "s" : ""}</div>` : "") +
    extra.slice(0, 2).map(listedRow).join("") + (extra.length > 2 ? `<div class="more">+${extra.length - 2} more listed</div>` : "") +
    (!p.accounts.length ? `<div class="muted">No accounts configured</div>` : "");
  const nx = waiting(p).find(j => j.kind !== "preflight") || waiting(p)[0];
  const next = nx ? `<span class="next trunc" title="${esc(jobText(nx).t + " " + jobText(nx).d)}">Next: <b>${esc(jobText(nx).t)}</b> · ${when(nx.run_at, now)} · ${rel(nx.run_at, now)}</span>` : `<span class="next">Nothing scheduled</span>`;
  const bad = needsAttention(p).length, un = unseenAlerts(p);
  return `<a class="card pcard" href="#/phone/${encodeURIComponent(p.id)}">
    <div class="top"><span class="name trunc">${esc(p.name)}</span><span class="pill ${p.status}">${esc(phoneStatus(p))}</span></div>
    ${accts}
    <div class="foot">${next}${bad ? `<span class="tag bad">${bad} failed</span>` : ""}${un ? `<span class="tag warn">${un} alert${un > 1 ? "s" : ""}</span>` : ""}</div></a>`;
}
function renderOverview() {
  const ps = S.phones, c = st => ps.filter(p => p.status === st).length;
  const bits = [`${ps.length} phone${ps.length === 1 ? "" : "s"}`];
  if (c("running")) bits.push(`${c("running")} running`);
  if (c("offline")) bits.push(`${c("offline")} offline`);
  if (c("error")) bits.push(`${c("error")} with errors`);
  if (c("manual")) bits.push(`${c("manual")} taken over`);
  const bad = ps.reduce((s, p) => s + needsAttention(p).length, 0);
  if (bad) bits.push(`${bad} failed job${bad > 1 ? "s" : ""}`);
  $("#summary").textContent = bits.join(" · ");
  $("#grid").innerHTML = ps.length ? ps.map(p => phoneCard(p, S.now)).join("") : `<div class="empty">No phones connected.</div>`;
}

// ---------------------------------------------------------------- phone detail
function btn(id, action, label, cls = "small", extra = "") {
  const busy = BUSY.has(id + ":" + action);
  return `<button class="${cls}" data-act="${action}" data-id="${id}" ${busy ? "disabled" : ""} ${extra}>${busy ? "…" : label}</button>`;
}
function groups(jobs) {
  const m = new Map();
  for (const j of jobs) {
    const k = j.app === "-" || !j.account || j.account === "-" ? "General" : `${j.app}|${j.account}`;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(j);
  }
  return [...m.entries()].sort((a, b) => (a[0] === "General") - (b[0] === "General") || a[0].localeCompare(b[0]));
}
function jobRow(j, now, kind) {
  const x = jobText(j), t = kind === "next" ? j.run_at : (j.started_at || j.run_at);
  const late = kind === "next" && j.run_at < now - 120 && j.kind !== "research";
  const full = [x.t, x.d, x.x].filter(Boolean).join(" · ");
  let acts = "", extra = "";
  if (j.started_at) acts += btn(j.id, "log", "Log", "small ghost");
  if (kind === "next") acts += btn(j.id, "now", "Run now") + btn(j.id, "skip", "Skip");
  if (kind === "bad" || j.status === "skipped") acts += btn(j.id, "retry", "Retry", "small primary");
  if (kind === "bad") extra = `<div class="e"><span class="trunc" title="${esc(j.error)}">${esc(j.error || j.status)}</span>` +
    (j.shot ? `<a href="/shots/${esc(j.shot)}" target="_blank" rel="noopener">screenshot</a>` : "") + `</div>`;
  const state = kind === "done" ? `<span class="state ${j.status}">${j.status}</span> ` : "";
  return `<div class="job"><div class="when"><b>${when(t, now)}</b><span class="${late ? "late" : ""}">${late ? "late · " : ""}${rel(t, now)}${j.attempts > 1 ? " · ×" + j.attempts : ""}</span></div>
    <div class="what"><div class="t">${state}<span>${esc(x.t)}</span>${x.x ? `<em>${esc(x.x)}</em>` : ""}</div>${x.d ? `<div class="d trunc" title="${esc(full)}">${esc(x.d)}</div>` : ""}${extra}</div>
    <div class="acts">${acts}</div></div>`;
}
function section(p, key, title, jobs, kind, openDefault, cls = "") {
  const k = p.id + ":" + key, open = OPEN[k] ?? openDefault;
  const gs = groups(jobs);
  const body = jobs.length ? gs.map(([g, js]) => {
    const head = gs.length > 1 ? `<div class="grp">${g === "General" ? "General" : appTag(js[0].app) + "@" + esc(js[0].account)}</div>` : "";
    return head + js.map(j => jobRow(j, S.now, kind)).join("");
  }).join("") : `<div class="empty">${kind === "next" ? "Nothing waiting." : kind === "bad" ? "All clear." : "Nothing finished yet today."}</div>`;
  return `<details class="card sec ${cls}" data-k="${esc(k)}" ${open ? "open" : ""}><summary>${title} <span class="badge ${kind === "bad" && jobs.length ? "hot" : ""}">${jobs.length}</span></summary><div class="body">${body}</div></details>`;
}
function renderPhone() {
  const p = CUR, now = S.now;
  $("#pName").textContent = p.name;
  const sel = $("#pSwitch");
  sel.hidden = S.phones.length < 2; $("#pName").hidden = !sel.hidden;
  if (!sel.hidden && sel.dataset.sig !== S.phones.map(x => x.id + x.name).join("|")) {
    sel.dataset.sig = S.phones.map(x => x.id + x.name).join("|");
    sel.innerHTML = S.phones.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
  }
  sel.value = p.id;
  const st = $("#pStatus"); st.textContent = phoneStatus(p) + (p.pausing ? " (finishing current job)" : ""); st.className = "pill " + p.status;
  const tb = $("#takeBtn");
  tb.textContent = BUSY.has("take") ? "…" : p.paused ? "Resume automation" : "Take over";
  tb.className = p.paused ? "primary" : "takeover"; tb.disabled = BUSY.has("take");
  $("#veil").style.display = p.paused ? "none" : "";

  $("#quotaCard").innerHTML = `<h3>Today's quota</h3>` + (p.accounts.length ? p.accounts.map(a => listed(a) ? listedRow(a) :
    `<div class="quota-row"><div class="who" style="display:flex;gap:6px;align-items:center;font-weight:600;min-width:0">${appTag(a.app)}<span class="trunc">@${esc(a.account)}</span></div>${quotas(a)}</div>`).join("") : `<div class="muted">No accounts configured.</div>`);

  const rc = $("#runningCard");
  if (p.running) {
    rc.hidden = false;
    rc.innerHTML = `<h3>Now</h3><b>${esc(KIND[p.running.kind] || p.running.kind)}</b> · ${esc(appName(p.running.app))} @${esc(p.running.account)} <span class="muted">· started ${hm(p.running.started_at)} (${rel(p.running.started_at, now)})</span>
      <div class="tail" id="tail">${esc(p.tail.join("\n"))}</div>`;
    const t = $("#tail"); t.scrollTop = t.scrollHeight;
  } else rc.hidden = true;

  const bad = needsAttention(p), nxt = waiting(p);
  const done = p.jobs.filter(j => ["done", "skipped"].includes(j.status)).sort((a, b) => (b.started_at || b.run_at) - (a.started_at || a.run_at));
  const attn = bad.sort((a, b) => b.run_at - a.run_at);
  $("#jobsBox").innerHTML = (p.mirror_error ? `<div class="card pad" style="color:var(--bad)">Screen mirror: ${esc(p.mirror_error)}</div>` : "") +
    (attn.length ? section(p, "bad", "Needs attention", attn, "bad", true, "attn") : "") +
    section(p, "next", "Up next", nxt, "next", true) +
    section(p, "done", "Done today", done, "done", false) +
    (!p.jobs.length ? `<div class="empty">No jobs. Drop a plan in mailbox/inbox/&lt;name&gt;/plan.json</div>` : "");
}

// ---------------------------------------------------------------- alerts (badge + collapsible list)
let alertsAll = false;
function renderAlerts() {
  const multi = S.phones.length > 1;
  const all = S.phones.flatMap(p => p.alerts.map(a => ({...a, phone: p}))).sort((a, b) => b.at - a.at);
  const unseen = all.filter(a => !a.seen).length;
  const b = $("#alertBadge"); b.textContent = unseen || all.length; b.className = "badge" + (unseen ? " hot" : "");
  b.title = unseen ? `${unseen} new of ${all.length}` : `${all.length} alerts, all seen`;
  const shown = alertsAll ? all : all.slice(0, 6);
  $("#alertPanel").innerHTML = `<div class="card">` + (all.length ? shown.map(a => `<div class="al ${a.seen ? "" : "unseen"}" title="${esc(dayhm(a.at))}">
      <span class="faint">${rel(a.at, S.now)}</span><span class="kind muted">${esc(a.kind)}</span>
      <span class="x trunc" title="${esc(a.text)}">${multi ? `<a href="#/phone/${encodeURIComponent(a.phone.id)}">${esc(a.phone.name)}</a> · ` : ""}${esc(a.text)}</span>
      <span class="mail faint">${a.emailed ? "emailed" : ""}</span></div>`).join("") +
    (all.length > 6 ? `<div style="padding-top:8px"><button class="small" id="alertMore">${alertsAll ? "Show fewer" : `Show all ${all.length}`}</button></div>` : "")
    : `<div class="empty">No alerts.</div>`) + `</div>`;
}

// ---------------------------------------------------------------- routing
let route = {name: "phones"}, shownPhone = null;
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, "");
  if (h.startsWith("phone/")) return {name: "phone", id: decodeURIComponent(h.slice(6))};
  return {name: h === "stats" ? "stats" : h === "research" ? "research" : "phones"};
}
function applyRoute() {
  route = parseRoute();
  const view = route.name === "phone" ? "phone" : route.name;
  for (const v of ["phones", "phone", "stats", "research"]) $("#view-" + v).hidden = v !== view;
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === (view === "phone" ? "phones" : view)));
  if (route.name === "stats" || route.name === "research") loadInsights(route.name);
  if (S) render();
}
function render() {
  if (!S) return;
  CUR = route.name === "phone" ? S.phones.find(p => p.id === route.id) || null : null;
  if (route.name === "phone" && !CUR) { location.hash = "#/"; return; }
  renderAlerts();
  if (route.name === "phones") renderOverview();
  if (CUR) {
    renderPhone();
    if (shownPhone !== CUR.id) { screenOn(false); shownPhone = CUR.id; screenOn(true); }
  } else if (shownPhone) { screenOn(false); shownPhone = null; }
}
window.addEventListener("hashchange", applyRoute);

async function poll() {
  try { S = normalize(await fetch("/api/state").then(r => r.json())); $("#conn").hidden = true; render(); } catch (e) { $("#conn").hidden = false; }
}
setInterval(poll, 2000);

// ---------------------------------------------------------------- actions (every button disables + shows … while in flight)
async function busy(key, fn) {
  if (BUSY.has(key)) return;
  BUSY.add(key); render();
  try { await fn(); } catch (e) { console.warn(e); } finally { BUSY.delete(key); await poll(); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (b) {
    const id = b.dataset.id, a = b.dataset.act;
    if (a === "log") busy(id + ":log", async () => { $("#logTitle").textContent = `Job ${id} log`; $("#logText").textContent = await fetch(`/api/job/${id}/log`).then(r => r.text()); logDlg.showModal(); });
    else busy(id + ":" + a, () => post(`/api/job/${id}/${a}`));
  }
  if (e.target.closest("#alertMore")) { alertsAll = !alertsAll; renderAlerts(); }
});
document.addEventListener("toggle", e => { const k = e.target.dataset?.k; if (k) OPEN[k] = e.target.open; }, true);
$("#takeBtn").onclick = () => busy("take", () => post((CUR.paused ? "/api/resume" : "/api/takeover") + phoneQ()));
$("#pSwitch").onchange = e => { location.hash = "#/phone/" + encodeURIComponent(e.target.value); };
$("#bellBtn").onclick = () => {
  const p = $("#alertPanel"); p.hidden = !p.hidden; $("#bellBtn").setAttribute("aria-expanded", String(!p.hidden));
  if (!p.hidden) post("/api/alerts/seen");
};

// ---------------------------------------------------------------- insights (post stats + research)
const F = {stats: {days: 7, app: "", account: ""}, research: {days: 14, app: ""}};
let insightSeq = 0;
const kfmt = v => v == null ? "–" : v >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : v >= 1e4 ? Math.round(v / 1e3) + "k" :
  v >= 1e3 ? (v / 1e3).toFixed(1).replace(/\.0$/, "") + "k" : String(Math.round(v));
const secs = v => v == null ? "–" : v.toFixed(1).replace(/\.0$/, "") + "s";
const pc = v => v == null ? "–" : Math.round(v) + "%";
const acctLabel = (app, a) => (app === "reddit" ? "u/" : "@") + a;

function dchip(d, mode, lower, unit = "") {  // change vs the prior period; lower = a drop is good (skip rate)
  const none = t => `<span class="dl na" title="${t}">–</span>`;
  if (!d || d.value == null || d.prev == null) return none("No data in the prior period");
  const v = mode === "pct" ? d.pct : d.diff;
  if (v == null) return `<span class="dl na" title="Nothing in the prior period">new</span>`;
  const z = Math.abs(v) < (mode === "pct" ? 0.5 : 0.05), good = lower ? v < 0 : v > 0;
  const txt = mode === "pct" ? Math.abs(v).toFixed(0) + "%" : Math.abs(v).toFixed(1).replace(/\.0$/, "") + unit;
  return `<span class="dl ${z ? "flat" : good ? "up" : "down"}" title="Prior ${F.stats.days} days: ${d.prev}">${z ? "±0" : (v > 0 ? "▲ " : "▼ ") + txt}</span>`;
}
const tile = (label, val, chip, dim) => `<div class="tile"><div class="tl">${label}</div><div class="tv${dim ? " dim" : ""}">${val}</div>${chip || ""}</div>`;

function spark(pts, w = 84, h = 26) {  // [{label, views}] -> inline SVG, baseline at 0 so growth reads honestly
  pts = (pts || []).filter(p => p.views != null);
  if (!pts.length) return `<span class="faint" style="font-size:11px">no snapshots</span>`;
  const max = Math.max(...pts.map(p => p.views));
  const x = i => pts.length === 1 ? w / 2 : 3 + i * (w - 6) / (pts.length - 1);
  const y = v => h - 3 - (max ? v / max : 0) * (h - 8);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.views).toFixed(1)}`).join(" ");
  const tip = pts.map(p => `${p.label}: ${n(p.views)}`).join(" · ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Views over time. ${esc(tip)}"><title>${esc(tip)}</title>` +
    `<line class="base" x1="0" x2="${w}" y1="${h - 3}" y2="${h - 3}"/>${pts.length > 1 ? `<polyline points="${line}"/>` : ""}` +
    `<circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(pts[pts.length - 1].views).toFixed(1)}" r="2.5"/></svg>`;
}
const thumb = p => `<span class="th">${p.thumb ? `<img src="${esc(p.thumb)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
const stateChip = p => p.state === "unverified" ? `<span class="chip bad" title="The Share tap was not confirmed: check the profile">unverified</span>`
  : p.state === "no_stats" ? `<span class="chip warn" title="First stats are read 1 h after posting">awaiting stats</span>` : "";
const dayShort = t => t ? new Date(t * 1000).toLocaleDateString([], {month: "short", day: "numeric"}) : "";

function postRow(p, rank) {
  const ok = p.state === "ok";
  const sub = ok ? `avg watch ${secs(p.avg_watch_s)}${p.skip_pct != null ? " · skip " + pc(p.skip_pct) : ""}${p.follows ? " · +" + p.follows + " follows" : ""}` : "";
  return `<div class="prow"><span class="rk">${rank ?? ""}</span>${thumb(p)}
    <div class="pmain"><div class="pc" title="${esc(p.caption)}">${esc(p.caption_short || p.label)}</div>
      <div class="pm">${appTag(p.app)}<span class="trunc">@${esc(p.account)}</span><span>${esc(p.label)}</span><span>${dayShort(p.posted_at)}</span>${stateChip(p)}</div></div>
    <div class="pnum">${ok ? `<b>${kfmt(p.views)}</b><span>views</span>` : `<span class="faint">no views</span>`}${ok && sub ? `<div class="faint" style="font-size:11px;white-space:nowrap">${esc(sub)}</div>` : ""}</div>
    <div class="sp-wrap">${spark(p.spark)}${p.spark.length ? `<div>${esc(p.spark[0].label)} → ${esc(p.spark[p.spark.length - 1].label)}</div>` : ""}</div></div>`;
}

function accountCard(c) {
  const s = c.summary, d = c.deltas, tt = c.app === "tiktok";
  const note = c.state === "empty" ? `<div class="note">No posts in this window${c.prior.posts ? ` (${c.prior.posts} in the period before)` : ""}.</div>`
    : c.state === "unverified" ? `<div class="note bad">Every post here is unverified: the Share tap was not confirmed. Check the profile before trusting these numbers.</div>`
    : c.state === "awaiting_stats" ? `<div class="note warn">Posted, but no stats have been read yet (the first read is 1 h after posting).</div>`
    : (s.unverified || s.awaiting_stats ? `<div class="note warn">${[s.unverified && s.unverified + " unverified", s.awaiting_stats && s.awaiting_stats + " awaiting stats"].filter(Boolean).join(", ")}: left out of the averages.</div>` : "");
  return `<div class="card acard"><div class="head">${appTag(c.app)}<span class="trunc">@${esc(c.account)}</span><span class="chip">${s.posts} post${s.posts === 1 ? "" : "s"}</span></div>

function seriesCard(s) {
  const mx = Math.max(1, ...s.parts.map(p => p.views_total || 0));
  const bars = s.parts.map(p => `<div class="pt" title="Part ${p.part ?? "?"}: ${p.views_total == null ? "no stats" : n(p.views_total) + " views"}"><i class="${p.views_total == null ? "na" : ""}" style="height:${p.views_total ? Math.max(6, p.views_total / mx * 100) : 6}%"></i>${p.part ?? "·"}</div>`).join("");
  const ab = s.ab, hi = ab && Math.max(ab.a.views_avg || 0, ab.b.views_avg || 0, 1);
  const row = (k) => `<div class="abrow${ab.winner === k ? " win" : ""}"><b>${k.toUpperCase()}</b><div class="bar"><i style="width:${(ab[k].views_avg || 0) / hi * 100}%"></i></div><span><b>${kfmt(ab[k].views_avg)}</b> avg · ${ab[k].posts} post${ab[k].posts === 1 ? "" : "s"}</span></div>`;
  const verdict = !ab ? "" : ab.winner === "tie" ? `<span class="chip">A and B tie</span>` : ab.winner ? `<span class="chip ok">${ab.winner.toUpperCase()} wins by ${ab.lift_pct == null ? "a lot" : Math.round(ab.lift_pct) + "%"}</span>` : `<span class="chip warn">not enough stats</span>`;
  return `<div class="card scard"><div class="head"><b>${esc(s.series)}</b>${s.apps.map(appTag).join("")}<span class="muted">${s.summary.posts} posts</span><span class="spacer"></span>${verdict}</div>
    <div class="tiles"><div class="tile"><div class="tl">Total views</div><div class="tv">${kfmt(s.summary.views_total)}</div></div>

}

function pairCard(p) {

  const mid = p.winner === "tie" ? "tie" : p.winner ? "+" + (p.lift_pct == null ? "∞" : Math.round(p.lift_pct) + "%") : "?";

async function loadInsights(which) {
  const seq = ++insightSeq, body = $(which === "stats" ? "#statsBody" : "#researchBody");
  const qs = new URLSearchParams(Object.entries(F[which]).filter(([, v]) => v !== "" && v != null));
  try {
    const R = await fetch(`/api/insights/${which}?${qs}`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    if (seq !== insightSeq) return;

  } catch (e) {

}

// ---------------------------------------------------------------- live screen (scrcpy -> WebCodecs)
const cv = $("#cv"), ctx = cv.getContext("2d"), msg = $("#screenMsg");
let W = 720, H = 1612, ws = null, useFallback = !("VideoDecoder" in window);
const hex = b => b.toString(16).padStart(2, "0");
function codecFromSps(cfg) {
  for (let i = 0; i + 4 < cfg.length; i++) {
    if (cfg[i] === 0 && cfg[i+1] === 0 && cfg[i+2] === 1 && (cfg[i+3] & 0x1f) === 7) return "avc1." + hex(cfg[i+4]) + hex(cfg[i+5]) + hex(cfg[i+6]);
  }
  return "avc1.42e01e";
}
// fell behind: ask the phone for a fresh key frame instead of waiting for the next scheduled one
const askKey = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({t: "keyframe"})); };
function startStream() {
  let dec = null, cfg = null, gotKey = false;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/screen" + phoneQ());
  const mine = ws;
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { msg.textContent = "waiting for video…"; };
  ws.onmessage = ev => {
    if (typeof ev.data === "string") { const m = JSON.parse(ev.data); if (m.error) msg.textContent = "screen: " + m.error; return; }
    const u = new Uint8Array(ev.data), t = u[0];
    if (t === 1) { const dv = new DataView(ev.data); W = dv.getUint32(1); H = dv.getUint32(5); cv.width = W; cv.height = H; }
    else if (t === 2) {
      cfg = u.slice(1); gotKey = false;
      if (dec) try { dec.close(); } catch (e) {}
      dec = new VideoDecoder({
        output: f => { ctx.drawImage(f, 0, 0, W, H); f.close(); msg.style.display = "none"; },
        error: e => { console.warn(e); gotKey = false; askKey(); },
      });
      dec.configure({codec: codecFromSps(cfg), optimizeForLatency: true});
    } else if (t === 3 && dec && dec.state === "configured") {
      const key = u[1] === 1;
      if (!gotKey && !key) return;
      if (dec.decodeQueueSize > 3 && !key) { gotKey = false; askKey(); return; }
      let data = u.subarray(2);
      if (key) { const d = new Uint8Array(cfg.length + data.length); d.set(cfg); d.set(data, cfg.length); data = d; gotKey = true; }
      dec.decode(new EncodedVideoChunk({type: key ? "key" : "delta", timestamp: performance.now() * 1000, data}));
    }
  };
  ws.onclose = () => {
    if (ws === mine) ws = null;
    if (dec) try { dec.close(); } catch (e) {}
    if (!wantStream) return;
    msg.style.display = ""; msg.textContent = "screen disconnected, reconnecting…";
    setTimeout(() => { if (wantStream && !ws) startStream(); }, 3000);
  };
}
// fallback: screenshots (browsers without WebCodecs, e.g. plain http on another device; use https via tailscale serve)
let img = null, fbRunning = false;
function fbTick() {
  if (!wantStream) { fbRunning = false; return; }
  fbRunning = true;
  const i = new Image(); i.onload = () => { img.src = i.src; msg.style.display = "none"; setTimeout(fbTick, 500); };
  i.onerror = () => setTimeout(fbTick, 2000); i.src = "/api/screen.png?" + (phoneQ() ? phoneQ().slice(1) + "&" : "") + Date.now();
}
// the screen only streams while a phone's detail page is open (and for that phone)
let wantStream = false;
function screenOn(on) {
  wantStream = on;
  if (!on) { if (ws) { const w = ws; ws = null; try { w.close(); } catch (e) {} } return; }
  msg.style.display = ""; msg.textContent = "connecting to the phone…";
  if (useFallback) {
    if (!img) { img = document.createElement("img"); cv.replaceWith(img); img.id = "cv"; }
    msg.textContent = "low-frame-rate mode (no WebCodecs here: open the dashboard over https)";
    if (!fbRunning) fbTick();
  } else if (!ws) startStream();
}

// input
const surface = () => $("#cv");
function toPhone(e) {
  const r = surface().getBoundingClientRect();
  return {x: Math.round((e.clientX - r.left) / r.width * W), y: Math.round((e.clientY - r.top) / r.height * H)};
}
let down = null, lastMove = 0;
const send = m => { if (!paused()) return; if (useFallback) return; if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
const scr = $("#screen");
scr.addEventListener("pointerdown", e => {
  if (!paused()) return;
  scr.setPointerCapture(e.pointerId); down = toPhone(e);
  send({t: "touch", a: 0, ...down});
});
scr.addEventListener("pointermove", e => {
  if (!down) return; const now = performance.now(); if (now - lastMove < 16) return; lastMove = now;
  send({t: "touch", a: 2, ...toPhone(e)});
});
scr.addEventListener("pointerup", e => {
  if (!down) return; const p = toPhone(e);
  if (useFallback) {
    const moved = Math.hypot(p.x - down.x, p.y - down.y) > 20;
    post("/api/input", withPhone(moved ? {t: "swipe", x1: down.x, y1: down.y, x2: p.x, y2: p.y} : {t: "tap", ...p}));
  } else send({t: "touch", a: 1, ...p});
  down = null;
});
document.querySelectorAll("[data-key]").forEach(b => b.onclick = () => {
  if (!paused()) { alertTake(); return; }
  useFallback ? post("/api/input", withPhone({t: "key", k: b.dataset.key})) : send({t: "key", k: b.dataset.key});
});
$("#typer").onsubmit = e => {
  e.preventDefault(); if (!paused()) { alertTake(); return; }
  const s = $("#typeIn").value; if (!s) return; send({t: "text", s}); $("#typeIn").value = "";
};
function alertTake() { const v = $("#veil"); v.style.display = ""; v.textContent = "Press “Take over” first."; setTimeout(() => v.textContent = "View only. Take over to control the phone.", 2500); }

applyRoute(); poll();
</script>
</body>
</html>
