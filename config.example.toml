# Content engine (noswipe.app) — box settings

[phone]   # ONE phone. For several phones replace this section with the [[phones]] entries below.
serial = "192.168.1.150:5555"     # later on the Pi: the USB serial (see `adb devices`)
hw_serial = "ZD222RWWGT"        # the phone's own serial (adb shell getprop ro.serialno): adb_keeper.sh finds it by this on a new network

# SEVERAL phones on the Pi's USB hub: one [[phones]] entry each, and no [phone] section (the engine refuses both).
# Every phone runs its own jobs; an account lives on exactly one phone (the same account on two phones is refused at start-up).
# The [accounts.*] sections below still hold each account's daily limits.
#
# [[phones]]
# id = "phone-1"                          # short name: dashboard, logs, jobs table. The old [phone] is "phone-1".
# label = "Moto G, left"                  # shown in the dashboard (optional)
# hw_serial = "ZD222RWWGT"                # required: adb shell getprop ro.serialno. Wi-Fi devices must report it, or they are refused.
# usb_serial = "ZD222RWWGT"               # optional: its serial on the cable, when `adb devices` shows another one than hw_serial
# wifi_serial = "192.168.1.150:5555"      # optional Wi-Fi fallback; adb_keeper.sh keeps it current
# noswipe_phone_id = "pi-rack-1-phone-3" # optional: the phone's id in NoSwipe's admin Run panel (default: id above)
# accounts = ["ig:@tinyloveshows", "tt:@nomoreawkwardness"]   # ig = Instagram, tt = TikTok
#             also "x:@handle" and "threads:@handle" (posts + stats, login checked, never logged into: see flows/x_threads.md)
#             and "reddit:u/name": listed in the dashboard only (login by hand via Take over, nothing automated)
# quotas = { posts_per_day = 2 }          # optional: overrides the [accounts.*] limits of this phone's accounts
#
# [[phones]]
# id = "phone-2"
# label = "Pixel, right"
# hw_serial = "REPLACE-WITH-ITS-SERIAL"
# accounts = ["ig:@secondaccount"]

# NoSwipe: run the dating accounts NoSwipe creates for its clients (README "NoSwipe"). OFF unless enabled = true.
# The API key is NEVER written here: export it in the engine's environment (systemd EnvironmentFile), see api_key_env.
# [noswipe]
# enabled = true
# base_url = "https://www.noswipe.app/api/automation/v1"
# api_key_env = "NOSWIPE_AUTOMATION_KEY"   # name of the environment variable that holds the key
# poll_every_min = 2                       # GET /runs per phone; at least 1
# stale_after_min = 10                     # no good answer this long: no new sessions, running ones stop
# session_every_min = 180                  # per account: pause between sessions
# session_minutes = 20                     # time budget of one session
# default_timezone = "America/Los_Angeles" # for runs that carry no timezone
# quiet_hours = "23:00-08:00"              # client-local; "off" disables
# swipe_caps = { tinder = 100, hinge = 25, bumble = 60 }   # per account per client-local day (these are the defaults)
# pace_s = [4, 14]                         # random pause between swipe batches
# batch_size = [4, 12]                     # swipes per batch

# Hub (michaelsxan/hub) posting queue via this rig: Hub rows of models set to "via rig" for Instagram / Threads / X are posted here.
# OFF unless enabled = true. The bearer token is NEVER written here: export it in the engine's environment
# (systemd EnvironmentFile, same as NOSWIPE_AUTOMATION_KEY). Each phone is asked for its own items (phone id = [[phones]] id in Hub's rig.json).
# [hub]
# enabled = true
# base_url = "https://hub.codenrap.com"
# token_env = "HUB_RIG_TOKEN"     # name of the environment variable that holds the token
# poll_every_min = 3              # GET /api/rig/plan per phone (Hub hands an item over the first time it lists it)
# horizon_min = 180               # ask for items due within this long
# dry_run = false                 # true = rehearse: media downloaded, compose screen filled, screenshot, cancelled, nothing posted or reported
# The accounts Hub names must exist under [[phones]] accounts and [accounts.<app>.<handle>] (use = "hub" or "practice" is fine for hub plans).

[dashboard]
host = "127.0.0.1"                 # local only; remote access goes through [access] below
port = 8080
resume_after_min = 10            # a dashboard take-over nobody touches this long resumes by itself (0 = never)

[mailbox]
inbox = "mailbox/inbox"            # one folder per day: plan.json + videos/ (later synced from S3)

[sync]   # render server over Tailscale: feedback goes up, finished plans come down
host = "studio@100.102.103.115"
every_min = 10
expect_plans = false   # true once nightly runs are live: warns when no plan arrived by plan_deadline
plan_deadline = "11:00"

[preflight]   # daily morning checks; problems are emailed hours before the first post
at = "09:30"

[schedule]
# stats snapshots after each post, in minutes: 1h 3h 6h 12h 24h 48h
stats_offsets_min = [60, 180, 360, 720, 1440, 2880]
tiktok_detailed_from_min = 1440    # TikTok Post analysis refreshes daily: only read it from the 24h snapshot on
research_margin_min = 4            # keep this much free before the next fixed job (posts, stats)
retry_after_min = 5
max_attempts = 2
# Posting pace per account (downtime must never become a burst of posts):
post_min_gap_min = 45              # at least this long after the account's last published post; later jobs are moved
post_max_late_min = 240            # a slot missed by more than this is skipped (stale), with one alert a day

# Accounts already logged in on the phone. Daily limits are per account.
[accounts.tiktok.nomoreawkwardness]
use = "practice"           # tests only; never in nightly plans
posts_per_day = 3
likes_per_day = 20
comments_per_day = 5
research_minutes_per_day = 60

[accounts.instagram.nomoreawkwardness]
use = "practice"           # tests only; never in nightly plans
posts_per_day = 3
likes_per_day = 20
comments_per_day = 5
research_minutes_per_day = 60

[accounts.instagram.tinyloveshows]   # noswipe: silent story seasons
use = "noswipe"
about = "silent story seasons (Tiny Love Shows)"
posts_per_day = 4
likes_per_day = 20
comments_per_day = 5
research_minutes_per_day = 60

# X and Threads (log in by hand once with Take over; the engine only checks the login, never types credentials)
# [accounts.x.yourhandle]
# use = "practice"           # "noswipe" once the flow has been run live; never in nightly plans while "practice"
# posts_per_day = 3
# [accounts.threads.yourhandle]
# use = "practice"
# posts_per_day = 3

# Engine-queued keyword research (off unless accounts is set). See README "Stats, research and trend export".
# [research_seeds]
# accounts = ["instagram:nomoreawkwardness", "tiktok:nomoreawkwardness"]
# per_account_per_day = 3
# minutes = 10
# max_likes = 3
# max_comments = 0

# Email alerts to yourself. Fill in a Gmail app password (https://myaccount.google.com/apppasswords) to turn on;
# while it is empty, alerts only show on the dashboard.
[email]
to = "olxzulfar@gmail.com"
from = "wegotit713@gmail.com"
smtp_host = "smtp.gmail.com"
smtp_port = 465
app_password = ""            # your Gmail app password (never commit it)

[instagram]
meta_ai_audio = "off"   # "off" = Turn off and share, "allow" = Share; unset = refuse and alert

[update]   # self-update: CI moves the deploy branch after green tests; the engine fast-forwards while idle
branch = "deploy"
every_min = 15
quiet_min = 20     # never restart when a post / delete / stats read is due within this many minutes

[remote]                           # remote dashboard: https://dashboard.zulfkhar.dev via Cloudflare Tunnel (see access.py)
port = 8081                        # cloudflared sends traffic here; every request needs the PIN cookie
pin = ""                           # empty = remote dashboard off; use 8+ characters
days = 30                          # stay logged in this long
max_tries = 10                     # wrong PINs per 15 minutes before the login locks for 15 minutes

[outliers]   # weekly niche-outlier scan (outliers.py) on a practice account; results go to the render server
account = "nomoreawkwardness"   # Instagram account that does the browsing (never the live one)
enabled = false                 # set true to run the weekly scan
every_days = 7
after = "10:00"                 # not before this time of day
minutes = 40
queries = ["animated love story", "love story animation", "couple animation", "cute couple cartoon",
           "silent animation story", "relationship animation", "crush story animation", "shy guy dating",
           "awkward first date", "approach anxiety"]
accounts = []                   # niche accounts we follow (approved by hand); discovery adds more by itself
ratio = 5                       # outlier = at least this many times the account median views
min_views = 20000

[health]   # dead-man's switch: healthchecks.io emails you when the engine stops pinging (Pi off, offline, crashed)
engine_url = ""                 # ping URL of a check with period 10 min and grace 90 min (one job can run ~60 min)
every_min = 5
