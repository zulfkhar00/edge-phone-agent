[project]
name = "content-engine"
version = "0.1.0"
description = "noswipe content engine: posts, stats and research on the Android phone, driven by nightly plans"
requires-python = ">=3.12"
dependencies = [
  "uiautomator2>=3.2,<4",
  "ocrmac>=1.0; sys_platform == 'darwin'",
  "aiohttp>=3.9",
]

[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
